<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e54"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>LingoFlow — Tradutor</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#162b28}*{box-sizing:border-box}body{margin:0;background:#e5ddd5}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:#efeae2}.header{background:#075e54;color:white;padding:15px 16px;display:flex;align-items:center;gap:12px}.logo{background:#fff2;border-radius:50%;padding:10px;font-size:23px}.header strong{font-size:20px}.header small{display:block;color:#d1eee6}.controls{background:#fff;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd}select,button,textarea{font:inherit}select{min-width:110px;flex:1;padding:10px;border:1px solid #c5d1cb;border-radius:10px;background:white}.swap,.action{border:0;border-radius:9px;background:#d9f3e7;padding:10px;cursor:pointer}.chat{flex:1;min-height:260px;padding:18px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}.bubble{max-width:88%;padding:11px 13px;border-radius:12px;box-shadow:0 1px 2px #0002;white-space:pre-wrap;overflow-wrap:anywhere}.original{align-self:flex-end;background:#dcf8c6}.translated{align-self:flex-start;background:#fff}.bubble small{display:block;color:#61756e;margin-bottom:5px;font-size:12px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button{font-size:13px;background:#e9f5f0;border:0;border-radius:7px;padding:7px 10px}.composer{background:#f4f4f4;padding:12px;display:flex;gap:9px;align-items:end}.composer textarea{flex:1;min-width:0;resize:vertical;min-height:50px;max-height:150px;border:1px solid #ddd;border-radius:13px;padding:12px}.send{border:0;background:#008f72;color:white;padding:14px;border-radius:12px;font-weight:bold}.status{font-size:12px;padding:5px 12px;background:#fff;color:#60736d}.notice{padding:12px;text-align:center;color:#687a72;font-size:13px}.error{color:#a92323}.bubble button{cursor:pointer}@media(min-width:760px){body{padding:22px}.app{min-height:calc(100dvh - 44px);border-radius:15px;overflow:hidden;box-shadow:0 10px 40px #0002}}</style></head><body><main class="app"><header class="header"><span class="logo">🌐</span><div><strong>LingoFlow</strong><small>Converse em qualquer idioma</small></div></header><div class="controls"><select id="from" aria-label="Idioma original"><option value="auto">Detectar idioma</option><option value="pt">Português</option><option value="en">Inglês</option><option value="es">Espanhol</option><option value="fr">Francês</option><option value="it">Italiano</option><option value="de">Alemão</option></select><button class="swap" id="swap" title="Inverter idiomas">⇄</button><select id="to" aria-label="Idioma da tradução"><option value="en">Inglês</option><option value="pt">Português</option><option value="es">Espanhol</option><option value="fr">Francês</option><option value="it">Italiano</option><option value="de">Alemão</option></select></div><section class="chat" id="chat" aria-live="polite"><div class="notice">Digite uma mensagem abaixo para traduzir.</div></section><div class="status" id="status">Traduções exigem conexão com a internet.</div><form class="composer" id="form"><textarea id="input" placeholder="Digite sua mensagem..." aria-label="Mensagem" required></textarea><button class="send" id="send" type="submit">Traduzir ➤</button></form></main><script src="app.js" defer></script></body></html>
